services:
  # Automação B (presença) — existente, INTOCADO. Continua exatamente como
  # estava; os dois serviços novos abaixo nunca importam nada dela nem são
  # importados por ela.
  - type: web
    name: automacao-b-presenca
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn automacao_b_presenca:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SYMPLA_TOKEN
        sync: false
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: BITRIX_FIELD_SYMPLA_EVENT_ID
        sync: false
      - key: BITRIX_FIELD_PRESENTE_NO_EVENTO
        sync: false

  # Painel administrativo (Dashboard/Eventos/Mapeamento/Cupons/Logs) —
  # processo Flask separado, nunca registrado dentro do serviço acima.
  - type: web
    name: sympla-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn interface_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SYMPLA_TOKEN
        sync: false
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: BITRIX_STAGE_INSCRITO_PRO_EVENTO
        sync: false
      - key: BITRIX_FIELD_DATA_DO_EVENTO
        sync: false
      - key: BITRIX_FIELD_NOME_DO_EVENTO
        sync: false
      - key: BITRIX_FIELD_SYMPLA_EVENT_ID
        sync: false
      - key: BITRIX_FIELD_ORIGEM
        sync: false
      - key: BITRIX_FIELD_FILTRAR_EVENTO
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false

  # Motor de sincronização (substitui o schedule do GitHub Actions +
  # cron-job.org) — mesmo formato "sobe, roda, sai" do workflow_dispatch de
  # hoje, sem o problema de dyno dormindo que um Worker persistente teria.
  # NOTA: Render Cron Jobs não têm plano free — confirmar o plano antes do
  # deploy (não decidi isso por você).
  - type: cron
    name: automacao-a-sync
    runtime: python
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python automacao_a_inscricoes.py
    envVars:
      - key: SYMPLA_TOKEN
        sync: false
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: BITRIX_STAGE_INSCRITO_PRO_EVENTO
        sync: false
      - key: BITRIX_FIELD_DATA_DO_EVENTO
        sync: false
      - key: BITRIX_FIELD_NOME_DO_EVENTO
        sync: false
      - key: BITRIX_FIELD_SYMPLA_EVENT_ID
        sync: false
      - key: BITRIX_FIELD_ORIGEM
        sync: false
      - key: BITRIX_FIELD_FILTRAR_EVENTO
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
