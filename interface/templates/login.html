{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<article class="login-card">
    <img class="brand-mark" src="{{ url_for('static', filename='webclip.png') }}" alt="">
    <h2>Eventos Sympla</h2>
    <p class="login-sub">Painel administrativo</p>
    {% if erro %}<p class="flash flash-erro">{{ erro }}</p>{% endif %}
    <form method="post">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autofocus>
        <button type="submit">Entrar</button>
    </form>
</article>
{% endblock %}
