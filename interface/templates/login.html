{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<article class="login-card">
    <img src="{{ url_for('static', filename='webclip.png') }}" alt="" style="display:block; margin:0 auto 1rem; height:56px; width:56px;">
    <h2>Eventos Sympla</h2>
    {% if erro %}<p class="flash flash-erro">{{ erro }}</p>{% endif %}
    <form method="post">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autofocus>
        <button type="submit">Entrar</button>
    </form>
</article>
{% endblock %}
