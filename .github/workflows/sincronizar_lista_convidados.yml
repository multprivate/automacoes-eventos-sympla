name: Sincronizar lista de eventos do campo Cliente convidado

on:
  # Baixa urgência (mantém só as opções de uma lista em dia, não reage a
  # inscrição nova de ninguém) — diária basta, mesmo espírito de
  # verificar_duplicados.yml.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: sincronizar-lista-convidados
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python sincronizar_lista_convidados.py
        env:
          SYMPLA_TOKEN: ${{ secrets.SYMPLA_TOKEN }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
